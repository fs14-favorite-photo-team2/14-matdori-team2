openapi: 3.1.0
info:
  title: 레시피 마켓플레이스 API
  version: 1.0.0
  description: |
    레시피 생성, 마켓플레이스 판매, 구매, 교환, 알림 및 시간당 랜덤 포인트 보상을
    위한 API 명세입니다. 현재 인증, 사용자 및 상태 확인 경로가 구현되어 있으며,
    나머지 경로는 구현 예정인 계약입니다. 모든 시각은 ISO 8601 형식의 UTC 문자열로
    표현하며, 날짜 경계가 필요한 규칙은 KST(UTC+09:00)를 기준으로 계산합니다.

    포인트, 재고 또는 소유권을 변경하는 작업은 일부만 반영되지 않도록 함께
    처리합니다. 별도 명시가 없는 한 JSON
    요청 본문에 정의되지 않은 필드가 포함되면 요청을 거부합니다.
servers:
  - url: /api
    description: 현재 API 서버
tags:
  - name: 인증
  - name: 사용자
  - name: 레시피
  - name: 마켓플레이스
  - name: 교환 제안
  - name: 알림
  - name: 랜덤 상자

paths:
  /health:
    get:
      summary: 서버 프로세스 생존 상태 확인
      operationId: checkHealth
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: 서버 프로세스가 실행 중임
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, const: ok }
  /ready:
    get:
      summary: 데이터베이스 연결을 포함한 서버 준비 상태 확인
      operationId: checkReadiness
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: 서버가 요청을 처리할 준비가 됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, const: ready }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/signup:
    post:
      tags: [인증]
      summary: 이메일과 비밀번호로 회원가입
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: 계정이 생성되고 로그인 세션이 설정됨
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: 이메일 또는 닉네임이 이미 존재함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                duplicateEmail:
                  value:
                    {
                      success: false,
                      error:
                        {
                          code: EMAIL_ALREADY_EXISTS,
                          message: 이미 가입된 이메일입니다.,
                        },
                    }
  /auth/login:
    post:
      tags: [인증]
      summary: 이메일과 비밀번호로 로그인
      operationId: logIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인됨
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: >-
            이메일 또는 비밀번호가 올바르지 않거나(`INVALID_CREDENTIALS`),
            비밀번호 없이 Google 계정으로만 가입된 이메일입니다(`GOOGLE_ACCOUNT_ONLY`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/logout:
    post:
      tags: [인증]
      summary: 현재 로그인 상태 종료
      operationId: logOut
      responses:
        '204':
          description: 로그아웃되고 세션 쿠키가 제거됨. 응답 본문은 없음
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedSessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/{provider}:
    get:
      tags: [인증]
      summary: OAuth 인증 시작
      operationId: startOAuth
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: redirectUri
          in: query
          description: >-
            인증 후 이동할 URI입니다. origin이 CLIENT_ORIGIN의 허용 주소와 일치할 때만
            사용합니다. 생략하거나 잘못된 URI 또는 허용되지 않은 origin을 전달하면 무시하고
            GOOGLE_OAUTH_SUCCESS_REDIRECT 또는 CLIENT_ORIGIN의 첫 번째 주소를 사용합니다.
          schema: { type: string, format: uri }
      responses:
        '302':
          { description: OAuth 제공자로 리디렉션하며 세션에 state를 저장함 }
        '503':
          description: Google OAuth 필수 환경 변수 중 하나 이상이 없어 비활성화됨 (GOOGLE_OAUTH_NOT_CONFIGURED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/{provider}/callback:
    get:
      tags: [인증]
      summary: OAuth 인증 완료
      operationId: finishOAuth
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: false
          description: Google 인증 성공 시 전달되는 인가 코드입니다. 거부 시에는 code 대신 error가 전달됩니다.
          schema: { type: string }
        - name: state
          in: query
          required: false
          description: code를 처리할 때 로그인 시작 세션에 저장한 값과 일치해야 합니다. 누락되거나 일치하지 않으면 인증에 실패합니다.
          schema: { type: string }
        - name: error
          in: query
          required: false
          description: OAuth provider가 인증을 거부하거나 실패한 경우 반환하는 오류 코드
          schema: { type: string }
      responses:
        '302':
          description: >-
            인증에 성공하면 세션 쿠키를 설정하고 프론트엔드로 리디렉션합니다.
            같은 이메일의 기존 계정이 있으면 해당 계정에 Google 로그인을 연결합니다.
            인증에 실패하면 첫 번째 CLIENT_ORIGIN의 로그인 페이지로 `oauthError` 쿼리 파라미터와
            함께 리디렉션합니다. `oauthError` 값은 `OAUTH_FAILED`,
            `GOOGLE_EMAIL_REQUIRED`, `GOOGLE_ACCOUNT_CONFLICT`,
            `NICKNAME_GENERATION_FAILED` 중 하나입니다.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
  /auth/{provider}/failure:
    get:
      tags: [인증]
      summary: OAuth 인증 실패 처리
      operationId: failOAuth
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: >-
            OAuth 제공자가 인증을 거부했을 때
            `oauthError=OAUTH_FAILED`를 붙여 프론트엔드 로그인 페이지로 리디렉션

  /users/me:
    get:
      tags: [사용자]
      summary: 현재 사용자 정보와 기능 사용 가능 여부 조회
      operationId: getCurrentUser
      description: |
        월간 레시피 생성 한도는 매월 1일 자정(KST)에 초기화되며, 이번 달에 생성한
        레시피 수를 집계합니다. 랜덤 상자는 마지막 수령 시각부터 1시간 뒤에 다시
        받을 수 있고, 지금 받을 수 있으면 nextClaimableAt은 null입니다.
      responses:
        '200':
          description: 현재 사용자 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [사용자]
      summary: 현재 사용자 정보 수정
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCurrentUserRequest' }
      responses:
        '200':
          description: 수정된 사용자 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/me/recipe-copies:
    get:
      tags: [사용자]
      summary: 현재 사용자가 보유한 레시피 사본 조회
      operationId: listMyRecipeCopies
      description: |
        현재 소유한 사본을 개별 항목으로 반환합니다. state를 생략하면 모든 상태를
        포함하며, 마이 레시피 화면에서는 state=OWNED로 조회합니다.
        meta.nextCursor를 같은 필터와 정렬 조건으로 전달하면 다음 페이지를
        조회합니다. 커서는 마지막 항목 ID의 문자열이며, 정렬 값이 같으면 ID를
        같은 방향으로 정렬합니다. 커서가 가리키는 항목이 삭제되었거나 현재 조회
        조건에 더 이상 맞지 않으면 400으로 응답합니다. 마지막 페이지 이후를
        조회하면 빈 배열과 nextCursor: null을 반환합니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/DifficultyFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/CopyState' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, title_asc, title_desc]
            default: newest
      responses:
        '200':
          description: 현재 사용자가 보유한 레시피 사본
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRecipeCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/market-listings:
    get:
      tags: [사용자]
      summary: 현재 사용자가 등록한 판매글 조회
      operationId: listMyListings
      description: |
        현재 사용자가 등록한 판매글을 조회합니다. 필터를 생략하면 모든 상태와
        판매 방식을 포함합니다. remainingQuantity는 아직 LISTED 상태로 남은 사본
        개수입니다. 페이지 커서 사용법은 /users/me/recipe-copies와 같습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/DifficultyFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - name: listingType
          in: query
          schema: { $ref: '#/components/schemas/ListingType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ListingStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: 현재 사용자의 판매글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/trade-offers:
    get:
      tags: [사용자]
      summary: 현재 사용자가 보낸 교환 제안 조회
      operationId: listMyTradeOffers
      description: |
        현재 사용자가 보낸 제안을 조회합니다. status를 생략하면 모든 상태를
        포함하며, 페이지 커서 사용법은 /users/me/recipe-copies와 같습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TradeOfferStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: 보낸 교환 제안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeOfferCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/received-trade-offers:
    get:
      tags: [사용자]
      summary: 현재 사용자가 받은 교환 제안 조회
      operationId: listReceivedTradeOffers
      description: |
        현재 사용자 소유의 판매글에 접수된 제안을 조회합니다. status를 생략하면
        모든 상태를 포함하며, 페이지 커서 사용법은 /users/me/recipe-copies와 같습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TradeOfferStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: 현재 사용자의 판매글에 접수된 교환 제안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeOfferCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/purchases:
    get:
      tags: [사용자]
      summary: 현재 사용자의 구매 내역 조회
      operationId: listMyPurchases
      description: |
        from과 to는 거래 생성 시각의 시작과 끝을 모두 포함하는 기간 필터입니다.
        과거 거래 후 잔액은 저장하지 않으므로 remainingPoints는 반환하지 않습니다.
        페이지 커서 사용법은 /users/me/recipe-copies와 같습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: 현재 사용자가 포인트로 구매한 레시피 사본 거래 내역
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/sales:
    get:
      tags: [사용자]
      summary: 현재 사용자의 판매 내역 조회
      operationId: listMySales
      description: |
        from과 to는 거래 생성 시각의 시작과 끝을 모두 포함하는 기간 필터입니다.
        과거 거래 후 잔액은 저장하지 않으므로 remainingPoints는 반환하지 않습니다.
        페이지 커서 사용법은 /users/me/recipe-copies와 같습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: 현재 사용자가 판매한 레시피 사본과 판매 수익 내역
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /recipes:
    post:
      tags: [레시피]
      summary: 레시피 생성 및 사본 발행
      operationId: createRecipe
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CreateRecipeRequest' }
            encoding:
              ingredients:
                contentType: application/json
      responses:
        '201':
          description: 레시피가 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecipeDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 월간 레시피 생성 한도에 도달함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                {
                  success: false,
                  error:
                    {
                      code: MONTHLY_RECIPE_LIMIT_REACHED,
                      message: 이번 달 레시피 생성 한도에 도달했습니다.,
                    },
                }
  /recipes/{recipeId}:
    get:
      tags: [레시피]
      summary: 레시피 상세 정보 조회
      description: >-
        인증된 사용자가 해당 레시피의 사본을 소유하거나 레시피를 생성한 경우에만
        상세 정보와 전체 재료 목록, 전체 조리 내용을 반환합니다. 권한이 없는 사용자는
        마켓플레이스 목록의 RecipeSummary에서 강조 재료만 확인할 수 있습니다.
      operationId: getRecipe
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '200':
          description: 레시피 상세 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecipeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [레시피]
      summary: 레시피 정보 수정
      description: 레시피 생성자만 수정할 수 있으며 발행된 사본 수를 나타내는 totalSupply는 수정할 수 없습니다.
      operationId: updateRecipe
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UpdateRecipeRequest' }
            encoding:
              ingredients:
                contentType: application/json
      responses:
        '200':
          description: 수정된 레시피 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecipeDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /market-listings:
    get:
      tags: [마켓플레이스]
      summary: 마켓플레이스 판매글 목록 조회
      operationId: listMarketListings
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/DifficultyFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - name: soldOut
          in: query
          schema: { type: boolean }
        - name: listingType
          in: query
          schema: { $ref: '#/components/schemas/ListingType' }
        - name: minPrice
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxPrice
          in: query
          description: minPrice와 함께 사용하면 minPrice 이상이어야 합니다.
          schema: { type: integer, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc]
            default: newest
      responses:
        '200':
          description: 커서 기반으로 조회된 판매글 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingCursorResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [마켓플레이스]
      summary: 직접 생성한 레시피 사본을 판매 또는 교환용으로 등록
      operationId: createMarketListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingRequest' }
      responses:
        '201':
          description: 판매글이 생성되고 해당 사본이 예약됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 사본을 판매할 수 없거나 사용 가능한 수량이 부족함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /market-listings/{listingId}:
    get:
      tags: [마켓플레이스]
      summary: 판매글 상세 정보 조회
      operationId: getMarketListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: 판매글 상세 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [마켓플레이스]
      summary: 판매 중인 판매글 수정
      operationId: updateMarketListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListingRequest' }
      responses:
        '200':
          description: 판매글이 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [마켓플레이스]
      summary: 판매글 판매 종료
      description: 판매글 상태를 WITHDRAWN으로 변경하고 남은 사본의 예약을 해제합니다.
      operationId: stopMarketListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '204': { description: 판매가 중지됨. 응답 본문은 없음 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /market-listings/{listingId}/purchases:
    post:
      tags: [마켓플레이스]
      summary: 포인트로 레시피 사본 한 장 구매
      description: 포인트 결제와 재고 차감이 모두 완료된 경우에만 구매를 반영하고, 구매한 사본의 everPurchased를 true로 설정합니다.
      operationId: purchaseListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '201':
          description: 구매가 완료됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /market-listings/{listingId}/trade-offers:
    post:
      tags: [교환 제안]
      summary: 레시피 1:1 교환 제안 생성
      operationId: createTradeOffer
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offeredCopyId]
              properties:
                offeredCopyId:
                  {
                    type: integer,
                    minimum: 1,
                    description: 교환을 제안할 레시피 사본 ID,
                    example: 84,
                  }
                message:
                  type: string
                  maxLength: 500
                  description: 선택 입력하는 교환 제시글. 생략하면 null로 저장합니다.
      responses:
        '201':
          description: 교환 제안이 생성되고 제안한 사본이 예약됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeOfferResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [교환 제안]
      summary: 판매글에 접수된 교환 제안 조회
      description: 판매글 소유자만 이 엔드포인트에 접근할 수 있습니다.
      operationId: listListingTradeOffers
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TradeOfferStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: 접수된 교환 제안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeOfferCursorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trade-offers/{tradeOfferId}/accept:
    post:
      tags: [교환 제안]
      summary: 대기 중인 교환 제안 승인
      description: 양쪽 레시피의 소유권 변경이 모두 완료된 경우에만 교환을 반영하고 판매글 재고를 차감합니다. 재고가 0이 되면 같은 판매글의 다른 대기 중인 제안을 취소 처리합니다.
      operationId: acceptTradeOffer
      parameters:
        - $ref: '#/components/parameters/TradeOfferId'
      responses:
        '200':
          description: 교환이 완료됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeOfferResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /trade-offers/{tradeOfferId}/reject:
    post:
      tags: [교환 제안]
      summary: 대기 중인 교환 제안 거절
      operationId: rejectTradeOffer
      parameters:
        - $ref: '#/components/parameters/TradeOfferId'
      responses:
        '200':
          description: 제안이 거절되고 제안한 사본의 예약이 해제됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeOfferResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /trade-offers/{tradeOfferId}:
    delete:
      tags: [교환 제안]
      summary: 자신이 보낸 대기 중 교환 제안 취소
      operationId: cancelTradeOffer
      parameters:
        - $ref: '#/components/parameters/TradeOfferId'
      responses:
        '204': { description: 제안이 취소되고 제안한 사본의 예약이 해제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications:
    get:
      tags: [알림]
      summary: 알림 목록 조회
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: isRead
          in: query
          schema: { type: boolean }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/NotificationType' }
      responses:
        '200':
          description: 최신순 알림 목록
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/NotificationCursorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/unread-count:
    get:
      tags: [알림]
      summary: 읽지 않은 알림 개수 조회
      operationId: getUnreadNotificationCount
      responses:
        '200':
          description: 읽지 않은 알림 개수
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [unreadCount]
                        properties:
                          unreadCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notificationId}/read:
    patch:
      tags: [알림]
      summary: 개별 알림 읽음 처리
      operationId: readNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          description: 알림 ID
          schema: { type: integer, minimum: 1, example: 501 }
      responses:
        '200':
          description: 수정된 알림
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    patch:
      tags: [알림]
      summary: 모든 알림을 읽음 처리
      operationId: readAllNotifications
      responses:
        '200':
          description: 읽음 처리된 알림 개수
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [updatedCount]
                        properties:
                          updatedCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /random-box:
    get:
      tags: [랜덤 상자]
      summary: 랜덤 상자 뽑기 가능 여부 조회
      operationId: getRandomBoxStatus
      responses:
        '200':
          description: 현재 뽑기 가능 여부와 대기 시간
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RandomBoxResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [랜덤 상자]
      summary: 랜덤 포인트 보상 획득
      description: 마지막 뽑기 이후 60분에 한 번 실행할 수 있습니다.
      operationId: claimRandomBox
      responses:
        '200':
          description: 포인트가 지급됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RandomBoxClaimResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 다음 뽑기까지의 대기 시간이 지나지 않음
          headers:
            Retry-After:
              schema: { type: integer, description: 다음 뽑기까지 남은 초 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >-
        서명된 세션 ID를 담은 HttpOnly 쿠키입니다. 브라우저가 자동으로 전송하므로
        클라이언트는 요청에 `credentials: 'include'`만 지정하면 됩니다.

        로컬 개발에서는 `SameSite=Lax`를 사용합니다. 프로덕션에서는
        `SameSite=None; Secure`를 사용하므로 HTTPS 연결에서만 설정되고 전송됩니다.

        쿠키 이름은 SESSION_COOKIE_NAME(기본 session), 만료 시간은 SESSION_TTL_SECONDS(기본 7일)로 설정합니다. 기존 세션으로 요청하면 만료 시각이
        연장되므로 인증이 필요한 응답에는 갱신된 `Set-Cookie` 헤더가 포함될 수 있습니다.
  headers:
    SessionCookie:
      description: >-
        로그인 세션을 생성하거나 만료 시각을 연장하는 HttpOnly 쿠키입니다.
        로컬에서는 `SameSite=Lax`, 프로덕션에서는 `Secure`와 `SameSite=None`을 사용합니다.
      schema:
        type: string
        example: 'session=opaque-token; Path=/; Expires=Wed, 10 Sep 2026 05:00:00 GMT; HttpOnly; Secure; SameSite=None'
    ClearedSessionCookie:
      description: 로그인 세션을 제거하는 만료된 HttpOnly 쿠키
      schema:
        type: string
        example: 'session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; Secure; SameSite=None'
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google] }
    RecipeId:
      name: recipeId
      in: path
      required: true
      description: 레시피 ID
      schema: { type: integer, minimum: 1, example: 42 }
    ListingId:
      name: listingId
      in: path
      required: true
      description: 판매글 ID
      schema: { type: integer, minimum: 1, example: 101 }
    TradeOfferId:
      name: tradeOfferId
      in: path
      required: true
      description: 교환 제안 ID
      schema: { type: integer, minimum: 1, example: 205 }
    Keyword:
      name: keyword
      in: query
      description: 레시피 제목에서 대소문자를 구분하지 않고 검색할 키워드
      schema: { type: string, minLength: 1, maxLength: 100 }
    DifficultyFilter:
      name: difficulty
      in: query
      schema: { $ref: '#/components/schemas/Difficulty' }
    CategoryFilter:
      name: category
      in: query
      schema: { $ref: '#/components/schemas/Category' }
    Cursor:
      name: cursor
      in: query
      description: 마지막 항목의 ID 문자열이며 1 이상 2147483647 이하여야 합니다.
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    CursorLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    DateFrom:
      name: from
      in: query
      description: 조회할 거래 기간의 시작 시각
      schema: { type: string, format: date-time }
    DateTo:
      name: to
      in: query
      description: 조회할 거래 기간의 종료 시각. from과 함께 사용하면 from 이후이거나 같아야 합니다.
      schema: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: 인증이 필요함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            {
              success: false,
              error:
                {
                  code: AUTHENTICATION_REQUIRED,
                  message: 로그인이 필요합니다.,
                },
            }
    Forbidden:
      description: 인증된 사용자가 해당 리소스를 소유하거나 관리할 권한이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 리소스를 찾을 수 없거나 현재 사용자에게 공개되지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 현재 리소스 상태에서는 작업을 수행할 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: 요청 값 검증에 실패함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 요청 값이 올바르지 않습니다.
              details:
                - { field: email, reason: 올바른 이메일 형식이 아닙니다. }
                - { field: null, reason: 비밀번호 확인이 일치하지 않습니다. }
    InternalServerError:
      description: 서버 또는 데이터베이스가 요청을 처리할 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
    ErrorCode:
      type: string
      enum:
        - EMAIL_ALREADY_EXISTS
        - NICKNAME_ALREADY_EXISTS
        - MONTHLY_RECIPE_LIMIT_REACHED
        - AUTHENTICATION_REQUIRED
        - INVALID_CREDENTIALS
        - GOOGLE_ACCOUNT_ONLY
        - GOOGLE_OAUTH_NOT_CONFIGURED
        - GOOGLE_EMAIL_REQUIRED
        - GOOGLE_ACCOUNT_CONFLICT
        - NICKNAME_GENERATION_FAILED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - VALIDATION_ERROR
        - BAD_REQUEST
        - ROUTE_NOT_FOUND
        - INTERNAL_SERVER_ERROR
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: [string, 'null']
                    description: 값이 잘못된 필드명. 특정 필드에 매이지 않는 오류는 null입니다.
                  reason: { type: string }
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, nickname, password, passwordConfirmation]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        nickname:
          {
            type: string,
            minLength: 2,
            maxLength: 20,
            pattern: '^[A-Za-z0-9가-힣_-]+$',
          }
        password:
          { type: string, format: password, minLength: 8, maxLength: 24 }
        passwordConfirmation:
          { type: string, format: password, minLength: 8, maxLength: 24 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          { type: string, format: password, minLength: 8, maxLength: 24 }
    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          {
            type: string,
            minLength: 2,
            maxLength: 20,
            pattern: '^[A-Za-z0-9가-힣_-]+$',
          }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserSummary' }
    UserSummary:
      type: object
      required: [id, email, nickname, points]
      properties:
        id: { type: integer, minimum: 1, description: 사용자 ID, example: 7 }
        email: { type: string, format: email, maxLength: 254 }
        nickname:
          {
            type: string,
            minLength: 2,
            maxLength: 20,
            pattern: '^[A-Za-z0-9가-힣_-]+$',
          }
        points: { type: integer, minimum: 0 }
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [recipeCreationQuota, randomBox]
          properties:
            recipeCreationQuota:
              type: object
              required: [limit, used, remaining, resetsAt]
              properties:
                limit: { type: integer, const: 3 }
                used: { type: integer, minimum: 0, maximum: 3 }
                remaining: { type: integer, minimum: 0, maximum: 3 }
                resetsAt:
                  {
                    type: string,
                    format: date-time,
                    description: 다음 월간 한도 초기화 시각. 매달 1일 자정(KST)입니다.,
                  }
            randomBox: { $ref: '#/components/schemas/RandomBoxStatus' }
    Difficulty:
      type: string
      enum: [EASY, NORMAL, HARD, MASTER]
    Category:
      type: string
      enum:
        [
          KOREAN,
          WESTERN,
          CHINESE,
          JAPANESE,
          ASIAN,
          HOME_BAKING,
          BEVERAGE,
          SAUCE,
          CONVENIENCE,
          FUSION,
        ]
    CopyState:
      type: string
      enum: [OWNED, LISTED, OFFERED]
    ListingType:
      type: string
      enum: [SALE, EXCHANGE, BOTH]
    ListingStatus:
      type: string
      enum: [ON_SALE, SOLD_OUT, WITHDRAWN]
    TradeOfferStatus:
      type: string
      enum: [PENDING, ACCEPTED, REFUSED, CANCELED]
    NotificationType:
      type: string
      enum:
        [
          PURCHASED,
          SOLD_OUT,
          TRADE_OFFER_NEW,
          TRADE_OFFER_ACCEPT,
          TRADE_OFFER_REFUSE,
        ]
    RecipeSummary:
      type: object
      required:
        - id
        - title
        - imageUrl
        - difficulty
        - category
        - summary
        - minPrice
        - ingredients
      properties:
        id: { type: integer, minimum: 1, description: 레시피 ID, example: 42 }
        title: { type: string, minLength: 1, maxLength: 100 }
        imageUrl:
          {
            type: string,
            format: uri,
            description: 저장된 imageUrls의 첫 번째 URL을 반환하는 대표 이미지입니다.,
          }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        category: { $ref: '#/components/schemas/Category' }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        minPrice: { type: integer, minimum: 0, maximum: 100000000 }
        ingredients:
          type: array
          description: >-
            isHighlight가 true인 재료만 반환합니다. 전체 재료 목록은 레시피 사본을
            소유하거나 생성한 사용자에게 RecipeDetail로만 제공하므로, 로그인하지 않은
            사용자와 사본을 소유하지 않은 사용자는 강조 재료만 확인할 수 있습니다.
            강조한 재료가 없거나 마이그레이션 이전 레시피는 빈 배열일 수 있습니다.
          items:
            $ref: '#/components/schemas/Ingredient'
    RecipeDetail:
      allOf:
        - $ref: '#/components/schemas/RecipeSummary'
        - type: object
          required:
            - creator
            - totalSupply
            - createdAt
            - imageUrls
            - ingredients
          properties:
            creator: { $ref: '#/components/schemas/PublicUser' }
            totalSupply: { type: integer, minimum: 1, maximum: 10 }
            content:
              type: string
              description: 현재 사용자가 조리 내용을 볼 권한이 있는 경우에만 포함됩니다.
            createdAt: { type: string, format: date-time }
            imageUrls:
              type: array
              minItems: 1
              maxItems: 10
              description: 업로드 순서대로 반환하는 이미지 URL 목록. 첫 URL은 imageUrl과 같습니다.
              items:
                type: string
                format: uri
            ingredients:
              type: array
              description: >-
                레시피 사본을 소유하거나 생성한 사용자에게 제공하는 전체 재료 목록으로,
                강조 재료만 반환하는 RecipeSummary의 규칙을 대체합니다.
                마이그레이션 이전 레시피는 재료를 보완하기 전까지 빈 배열일 수 있습니다.
              items:
                $ref: '#/components/schemas/Ingredient'
    PublicUser:
      type: object
      required: [id, nickname]
      properties:
        id: { type: integer, minimum: 1, description: 사용자 ID, example: 7 }
        nickname:
          {
            type: string,
            minLength: 2,
            maxLength: 20,
            pattern: '^[A-Za-z0-9가-힣_-]+$',
          }
    CreateRecipeRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - images
        - content
        - minPrice
        - difficulty
        - totalSupply
        - category
        - summary
        - ingredients
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string, minLength: 1, maxLength: 20000 }
        minPrice: { type: integer, minimum: 0, maximum: 100000000 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        totalSupply: { type: integer, minimum: 1, maximum: 10 }
        category: { $ref: '#/components/schemas/Category' }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        images:
          type: array
          minItems: 1
          maxItems: 10
          description: 이미지 파일 1~10개. images 필드를 반복하여 전송하며 첫 번째 파일이 대표 이미지입니다. 수정 시 생략하면 기존 이미지를 유지하고, 전송하면 전체 이미지 목록을 교체합니다.
          items:
            type: string
            format: binary
        ingredients:
          $ref: '#/components/schemas/Ingredients'
    UpdateRecipeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string, minLength: 1, maxLength: 20000 }
        minPrice: { type: integer, minimum: 0, maximum: 100000000 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        category: { $ref: '#/components/schemas/Category' }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        images:
          type: array
          minItems: 1
          maxItems: 10
          description: 이미지 파일 1~10개. images 필드를 반복하여 전송하며 첫 번째 파일이 대표 이미지입니다. 수정 시 생략하면 기존 이미지를 유지하고, 전송하면 전체 이미지 목록을 교체합니다.
          items:
            type: string
            format: binary
        ingredients:
          $ref: '#/components/schemas/Ingredients'
    RecipeCopy:
      type: object
      required: [id, recipe, state, everPurchased, createdAt, updatedAt]
      properties:
        id:
          {
            type: integer,
            minimum: 1,
            description: 레시피 사본 ID,
            example: 84,
          }
        recipe: { $ref: '#/components/schemas/RecipeSummary' }
        listingId:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 사본이 등록된 판매글 ID,
            example: 101,
          }
        state: { $ref: '#/components/schemas/CopyState' }
        everPurchased: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateListingRequest:
      type: object
      additionalProperties: false
      required: [recipeCopyIds, listingType]
      properties:
        recipeCopyIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: 판매글에 등록할 동일 레시피의 사본 ID 목록
          items: { type: integer, minimum: 1 }
          example: [84, 85]
        listingType: { $ref: '#/components/schemas/ListingType' }
        price:
          {
            type: integer,
            minimum: 0,
            maximum: 100000000,
            description: SALE 또는 BOTH 방식인 경우 필수입니다.,
          }
        wantedDifficulty: { $ref: '#/components/schemas/Difficulty' }
        wantedCategory: { $ref: '#/components/schemas/Category' }
        wantedDescription: { type: string, maxLength: 500 }
    UpdateListingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        price: { type: integer, minimum: 0, maximum: 100000000 }
        listingType: { $ref: '#/components/schemas/ListingType' }
        wantedDifficulty: { $ref: '#/components/schemas/Difficulty' }
        wantedCategory: { $ref: '#/components/schemas/Category' }
        wantedDescription: { type: string, maxLength: 500 }
    ListingSummary:
      type: object
      required:
        [
          id,
          recipe,
          seller,
          listingType,
          price,
          initialQuantity,
          remainingQuantity,
          wantedDifficulty,
          wantedCategory,
          wantedDescription,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer, minimum: 1, description: 판매글 ID, example: 101 }
        recipe: { $ref: '#/components/schemas/RecipeSummary' }
        seller: { $ref: '#/components/schemas/PublicUser' }
        listingType: { $ref: '#/components/schemas/ListingType' }
        price: { type: [integer, 'null'], minimum: 0, maximum: 100000000 }
        initialQuantity: { type: integer, minimum: 1 }
        remainingQuantity:
          {
            type: integer,
            minimum: 0,
            description: 아직 LISTED 상태로 남은 사본 개수,
          }
        wantedDifficulty:
          {
            anyOf:
              [{ $ref: '#/components/schemas/Difficulty' }, { type: 'null' }],
          }
        wantedCategory:
          {
            anyOf:
              [{ $ref: '#/components/schemas/Category' }, { type: 'null' }],
          }
        wantedDescription: { type: [string, 'null'], maxLength: 500 }
        status: { $ref: '#/components/schemas/ListingStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Purchase:
      type: object
      required:
        [id, listingId, recipeCopyId, buyerId, sellerId, price, createdAt]
      properties:
        id: { type: integer, minimum: 1, description: 구매 ID, example: 310 }
        listingId:
          { type: integer, minimum: 1, description: 판매글 ID, example: 101 }
        recipeCopyId:
          {
            type: integer,
            minimum: 1,
            description: 구매한 레시피 사본 ID,
            example: 84,
          }
        buyerId:
          { type: integer, minimum: 1, description: 구매자 ID, example: 12 }
        sellerId:
          { type: integer, minimum: 1, description: 판매자 ID, example: 7 }
        price: { type: integer, minimum: 0, maximum: 100000000 }
        createdAt: { type: string, format: date-time }
    PurchaseResult:
      allOf:
        - $ref: '#/components/schemas/Purchase'
        - type: object
          required: [remainingPoints]
          properties:
            remainingPoints:
              {
                type: integer,
                minimum: 0,
                description: 결제 후 구매자에게 남은 포인트,
              }
    TradeOffer:
      type: object
      required:
        - id
        - listingId
        - proposer
        - offeredCopy
        - status
        - createdAt
        - message
      properties:
        id:
          { type: integer, minimum: 1, description: 교환 제안 ID, example: 205 }
        listingId:
          { type: integer, minimum: 1, description: 판매글 ID, example: 101 }
        proposer: { $ref: '#/components/schemas/PublicUser' }
        offeredCopy: { $ref: '#/components/schemas/RecipeCopy' }
        receivedCopyId:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 교환 승인 시 상대방에게 전달된 판매자의 레시피 사본 ID,
            example: 86,
          }
        status: { $ref: '#/components/schemas/TradeOfferStatus' }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        message:
          type:
            - string
            - 'null'
          maxLength: 500
          description: 교환 제시글. 입력하지 않은 경우 null입니다.
    Notification:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id: { type: integer, minimum: 1, description: 알림 ID, example: 501 }
        type: { $ref: '#/components/schemas/NotificationType' }
        message: { type: string, maxLength: 1000 }
        actor:
          {
            anyOf:
              [{ $ref: '#/components/schemas/PublicUser' }, { type: 'null' }],
          }
        recipe:
          {
            anyOf:
              [
                { $ref: '#/components/schemas/RecipeSummary' },
                { type: 'null' },
              ],
          }
        listingId:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 관련 판매글 ID,
            example: 101,
          }
        purchaseId:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 관련 구매 ID,
            example: 310,
          }
        tradeOfferId:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 관련 교환 제안 ID,
            example: 205,
          }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    RandomBoxStatus:
      type: object
      required: [canClaim, lastClaimedAt, nextClaimableAt]
      properties:
        canClaim: { type: boolean }
        lastClaimedAt: { type: [string, 'null'], format: date-time }
        nextClaimableAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: 다음 뽑기가 가능해지는 시각. 지금 뽑을 수 있으면 null입니다.,
          }
    RandomBoxResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RandomBoxStatus' }
    RandomBoxClaimResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [rewardPoints, currentPoints, nextClaimableAt]
              properties:
                rewardPoints: { type: integer }
                currentPoints: { type: integer, minimum: 0 }
                nextClaimableAt: { type: string, format: date-time }
    CursorMeta:
      type: object
      required: [nextCursor, hasNext]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    MyRecipeCursorResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          { type: array, items: { $ref: '#/components/schemas/RecipeCopy' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
    ListingCursorResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          {
            type: array,
            items: { $ref: '#/components/schemas/ListingSummary' },
          }
        meta: { $ref: '#/components/schemas/CursorMeta' }
    PurchaseCursorResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, items: { $ref: '#/components/schemas/Purchase' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
    ListingResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListingSummary' }
    TradeOfferCursorResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          { type: array, items: { $ref: '#/components/schemas/TradeOffer' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
    TradeOfferResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TradeOffer' }
    NotificationCursorResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
    Ingredient:
      type: object
      additionalProperties: false
      required:
        - name
        - amount
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          example: 트러플
        amount:
          type: string
          minLength: 1
          pattern: \S
          description: 단위를 포함한 분량 또는 약간, 취향껏 등의 표현
          example: 10g
        isHighlight:
          type: boolean
          default: false
    Ingredients:
      type: array
      description: 재료를 최소 1개 입력합니다. 수정 시 생략하면 유지하고 전송하면 전체 목록을 교체합니다. isHighlight 생략값은 false이며 강조할 재료 개수에는 제한이 없습니다.
      items:
        $ref: '#/components/schemas/Ingredient'
      minItems: 1

security:
  - sessionCookie: []
